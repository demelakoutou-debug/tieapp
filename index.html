<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Step Index — Live (Auth v2)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* [TOUT LE CSS EXISTANT INCHANGÉ] */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0d0f17; --surface: #141720; --surface2: #1c2030;
            --border: #252a3a; --border2: #2f3650; --text: #c8cdd8;
            --muted: #5a6480; --accent: #3d7eff;
            --green: #00c896; --red: #ff4d6a; --orange: #ffaa40; --purple: #b47aff;
        }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
               display:flex; flex-direction:column; height:100vh; overflow:hidden; user-select:none; }

        header { background:var(--surface); border-bottom:1px solid var(--border);
                 padding:0 14px; display:flex; align-items:center; gap:10px;
                 height:52px; flex-shrink:0; z-index:20; overflow-x:auto; overflow-y:hidden; }
        header::-webkit-scrollbar { height:0; }
        .logo { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
                color:var(--accent); display:flex; align-items:center; gap:6px; white-space:nowrap; }
        .logo-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
        .vdiv { width:1px; height:24px; background:var(--border); flex-shrink:0; }

        .market-wrap { position:relative; flex-shrink:0; }
        .market-wrap::after { content:'▾'; position:absolute; right:8px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; font-size:10px; }
        select#market-select { appearance:none; background:var(--surface2); border:1px solid var(--border2);
            color:var(--text); padding:6px 24px 6px 9px; border-radius:6px; font-size:12px;
            font-family:'JetBrains Mono',monospace; font-weight:600; cursor:pointer; transition:border-color .2s; }
        select#market-select:hover, select#market-select:focus { outline:none; border-color:var(--accent); }

        .btn { display:flex; align-items:center; gap:4px; padding:5px 11px; border-radius:6px;
               border:1px solid var(--border2); background:var(--surface2); color:var(--muted);
               font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap;
               font-family:'Inter',sans-serif; flex-shrink:0; }
        .btn:hover { color:var(--text); background:#1e2335; }
        .btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 10px rgba(61,126,255,.28); }
        .btn-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }

        .param-panel { display:flex; align-items:stretch; background:var(--surface2);
                       border:1px solid var(--border2); border-radius:7px; overflow:hidden; flex-shrink:0; height:34px; }
        .param-section { display:flex; align-items:center; gap:10px; padding:0 14px; }
        .param-section + .param-section { border-left:1px solid var(--border); }
        .param-badge { font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
                       padding:2px 6px; border-radius:3px; letter-spacing:.5px; flex-shrink:0; }
        .badge-sar { background:rgba(255,170,64,.15); color:var(--orange); }
        .badge-frc { background:rgba(180,122,255,.15); color:var(--purple); }
        .param-row { display:flex; align-items:center; gap:5px; }
        .param-lbl { color:var(--muted); font-size:10px; white-space:nowrap; }
        .param-input { width:54px; background:var(--bg); border:1px solid var(--border2); color:#fff;
                       padding:4px 6px; border-radius:4px; font-size:11px;
                       font-family:'JetBrains Mono',monospace; text-align:center; transition:border-color .2s; }
        .param-input.wide { width:80px; font-size:12px; padding:5px 8px; }
        .param-input:focus { outline:none; border-color:var(--accent); }

        .header-right { margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0; }
        .stat-block { display:flex; flex-direction:column; align-items:flex-end; }
        .stat-lbl { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
        .stat-val { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; }
        .val-high { color:var(--green); } .val-low { color:var(--red); }
        .live-box { display:flex; flex-direction:column; align-items:flex-end; padding:4px 10px;
                    background:var(--surface2); border:1px solid var(--border2); border-radius:6px; min-width:95px; }
        .live-lbl { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
        #last-price { font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; transition:color .25s; }
        .status-pill { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); white-space:nowrap; }
        .dot { width:6px; height:6px; border-radius:50%; background:var(--red); transition:background .3s; }
        .dot.on { background:var(--green); box-shadow:0 0 6px var(--green); animation:dpulse 2s infinite; }
        @keyframes dpulse { 0%,100%{box-shadow:0 0 5px var(--green)}50%{box-shadow:0 0 12px var(--green)} }

        #trade-bar { background:var(--surface); border-bottom:1px solid var(--border);
                     padding:7px 14px; display:flex; align-items:center; gap:10px;
                     flex-shrink:0; flex-wrap:nowrap; overflow-x:auto; }
        #trade-bar::-webkit-scrollbar { height:0; }

        .tbar-vdiv { width:1px; height:36px; background:var(--border); flex-shrink:0; }
        .tf { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
        .tf-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
        .tf-row { display:flex; align-items:center; gap:5px; }

        .t-input { background:var(--bg); border:1px solid var(--border2); color:var(--text);
                   padding:5px 8px; border-radius:5px; font-size:12px;
                   font-family:'JetBrains Mono',monospace; transition:border-color .2s; }
        .t-input:focus { outline:none; border-color:var(--accent); }
        #stake-input { width:65px; text-align:center; }

        #btn-connect { padding:5px 12px; border-radius:5px; border:1px solid var(--border2);
                       background:var(--surface2); color:var(--muted); font-size:11px; font-weight:700;
                       cursor:pointer; transition:all .18s; font-family:'Inter',sans-serif; white-space:nowrap; }
        #btn-connect:hover { border-color:var(--accent); color:var(--accent); background:#151c35; }
        #btn-connect.connected { background:rgba(0,200,150,.12); border-color:rgba(0,200,150,.4); color:var(--green); }
        #btn-connect.connecting { background:rgba(61,126,255,.1); border-color:var(--accent); color:var(--accent); }

        .token-status { font-size:9px; font-family:'JetBrains Mono',monospace; }

        .dur-type-group { display:flex; border-radius:5px; overflow:hidden; border:1px solid var(--border2); }
        .dur-type-btn { padding:5px 9px; background:var(--bg); border:none; color:var(--muted);
                        font-size:10px; font-weight:700; cursor:pointer; transition:all .15s; font-family:'JetBrains Mono',monospace; }
        .dur-type-btn.active { background:var(--accent); color:#fff; }
        #dur-value { width:52px; text-align:center; }

        .toggle-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; }
        .toggle-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; text-align:center; white-space:nowrap; }
        .toggle-switch { position:relative; width:38px; height:20px; cursor:pointer; }
        .toggle-switch input { opacity:0; width:0; height:0; position:absolute; }
        .toggle-track { position:absolute; inset:0; border-radius:10px; background:var(--border2); transition:background .2s; }
        .toggle-switch input:checked ~ .toggle-track { background:var(--accent); }
        .toggle-thumb { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
                        background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.4); }
        .toggle-switch input:checked ~ .toggle-track ~ .toggle-thumb { transform:translateX(18px); }

        .trade-btn {
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:0px; padding:5px 22px; border-radius:7px; border:2px solid transparent;
            cursor:pointer; font-family:'JetBrains Mono',monospace; font-weight:700;
            transition:all .18s; min-width:90px; flex-shrink:0;
        }
        .trade-btn .tb-icon { font-size:16px; line-height:1.1; }
        .trade-btn .tb-main { font-size:13px; letter-spacing:.3px; }
        .trade-btn .tb-sub  { font-size:9px; font-weight:400; letter-spacing:.3px; opacity:.8; }

        .btn-rise { background:rgba(0,200,150,.1); border-color:rgba(0,200,150,.3); color:var(--green); }
        .btn-rise:hover { background:rgba(0,200,150,.2); border-color:var(--green); box-shadow:0 0 14px rgba(0,200,150,.2); }
        .btn-rise.flash { background:var(--green) !important; color:#000 !important; border-color:var(--green) !important; }

        .btn-fall { background:rgba(255,77,106,.1); border-color:rgba(255,77,106,.3); color:var(--red); }
        .btn-fall:hover { background:rgba(255,77,106,.2); border-color:var(--red); box-shadow:0 0 14px rgba(255,77,106,.2); }
        .btn-fall.flash { background:var(--red) !important; color:#fff !important; border-color:var(--red) !important; }

        #chart-wrap { flex:1; display:flex; position:relative; overflow:hidden; }
        #chart-container { flex:1; position:relative; padding:10px 0 8px 10px; }
        canvas { display:block; width:100% !important; height:100% !important; }

        #y-drag-zone { width:58px; flex-shrink:0; cursor:ns-resize; display:flex; align-items:center; justify-content:center; z-index:5; }
        #y-drag-hint { writing-mode:vertical-rl; font-size:9px; color:var(--border2); letter-spacing:1px;
                       pointer-events:none; transition:color .2s; font-family:'JetBrains Mono',monospace; }
        #y-drag-zone:hover #y-drag-hint { color:var(--muted); }
        #y-drag-zone.dragging #y-drag-hint { color:var(--accent); }

        #chart-labels { position:absolute; inset:10px 0 8px 10px; pointer-events:none; overflow:hidden; }
        .price-hline { position:absolute; left:0; right:62px; height:0;
                       border-top-width:1px; border-top-style:dashed;
                       transform:translateY(-50%); transition:top .1s ease; }
        .hline-high { border-color:rgba(0,200,150,.45); }
        .hline-low  { border-color:rgba(255,77,106,.45); }
        .hline-curr { border-color:rgba(61,126,255,.7); border-top-style:solid; }

        .price-badge { position:absolute; right:4px; transform:translateY(-50%); transition:top .1s ease; }
        .badge-tag { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
                     padding:2px 8px; border-radius:4px; white-space:nowrap; }
        #badge-high .badge-tag { background:rgba(0,200,150,.18); color:var(--green); border:1px solid rgba(0,200,150,.35); }
        #badge-low  .badge-tag { background:rgba(255,77,106,.18); color:var(--red);  border:1px solid rgba(255,77,106,.35); }
        #badge-curr .badge-tag { background:var(--accent); color:#fff; font-size:11px; padding:3px 9px; }

        .peak-label { position:absolute; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
                      padding:2px 6px; border-radius:4px; white-space:nowrap; pointer-events:none;
                      box-shadow:0 1px 4px rgba(0,0,0,.5); }
        .peak-label.high { background:rgba(0,200,150,.18); color:var(--green); border:1px solid rgba(0,200,150,.4); }
        .peak-label.low  { background:rgba(255,77,106,.18); color:var(--red);   border:1px solid rgba(255,77,106,.4); }

        .badge-st  { background:rgba(255,200,0,.13); color:#ffc800; }

        .streak-block { display:flex; align-items:center; gap:7px; }
        .streak-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
        .streak-pill {
            display:flex; align-items:center; gap:4px;
            padding:2px 9px; border-radius:12px;
            font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
        }
        .streak-pill.bull { background:rgba(0,200,150,.15); color:var(--green); border:1px solid rgba(0,200,150,.35); }
        .streak-pill.bear { background:rgba(255,77,106,.15); color:var(--red);   border:1px solid rgba(255,77,106,.35); }
        .streak-pill.flat { background:rgba(90,100,128,.15); color:var(--muted); border:1px solid var(--border2); }

        #ev-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 5px 16px;
            display: flex; align-items: center; gap: 14px;
            flex-shrink: 0; overflow-x: auto; font-size: 11px;
        }
        #ev-bar::-webkit-scrollbar { height: 0; }
        .ev-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
        .ev-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
        .ev-pos  { color: var(--green); }
        .ev-neg  { color: var(--red); }
        .ev-neut { color: var(--muted); }
        .ev-sep  { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
        .ev-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 5px;
            border: 1px solid var(--border2); background: var(--surface2);
        }
        .tie-bar-wrap { display: flex; align-items: center; gap: 6px; }
        .tie-bar-track { width: 80px; height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
        .tie-bar-fill  { height: 100%; background: var(--orange); border-radius: 3px; transition: width .3s; }
        .ev-mode-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
        .tag-impair { background: rgba(61,126,255,.15); color: var(--accent); }
        .tag-pair   { background: rgba(255,170,64,.15);  color: var(--orange); }
        .tag-eq     { background: rgba(0,200,150,.15);   color: var(--green);  }

        #markov-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 6px 16px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0; overflow-x: auto;
        }
        #markov-bar::-webkit-scrollbar { height: 0; }
        .mk-section { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .mk-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
        .mk-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
        .mk-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
        .mk-input {
            width: 68px; background: var(--bg); border: 1px solid var(--border2);
            color: #fff; padding: 5px 8px; border-radius: 4px;
            font-size: 13px; font-family: 'JetBrains Mono', monospace;
            text-align: center; transition: border-color .2s;
        }
        .mk-input:focus { outline: none; border-color: var(--accent); }
        .mk-signal {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 14px; border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; font-weight: 700;
            border: 1px solid transparent; transition: all .3s;
        }
        .mk-signal.bull  { background: rgba(0,200,150,.15); color: var(--green); border-color: rgba(0,200,150,.4); }
        .mk-signal.bear  { background: rgba(255,77,106,.15); color: var(--red);   border-color: rgba(255,77,106,.4); }
        .mk-signal.neut  { background: var(--surface2);      color: var(--muted); border-color: var(--border2); }
        .mk-signal.hot   { box-shadow: 0 0 14px rgba(0,200,150,.35); }
        .mk-conf-bar-track { width: 90px; height: 7px; background: var(--border2); border-radius: 4px; overflow: hidden; }
        .mk-conf-bar-fill  { height: 100%; border-radius: 4px; transition: width .4s, background .4s; }
        .mk-matrix-wrap { display: flex; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; flex-wrap: wrap; max-width: 260px; }
        .mk-matrix-cell { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 2px 5px; white-space: nowrap; color: var(--muted); }
        .mk-matrix-cell.strong { color: var(--green); border-color: rgba(0,200,150,.3); }
        .mk-matrix-cell.weak   { color: var(--red);   border-color: rgba(255,77,106,.3); }

        #stats-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 5px 16px;
            display: flex; align-items: center; gap: 20px;
            flex-shrink: 0; overflow-x: auto;
        }
        #stats-bar::-webkit-scrollbar { height:0; }
        .stat-pill { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .stat-pill .sp-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .stat-pill .sp-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--text); }
        .stat-sep { width:1px; height:18px; background:var(--border); flex-shrink:0; }

        .btn-double {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1px; padding: 5px 14px; border-radius: 7px;
            border: 2px solid rgba(180,122,255,.35);
            background: rgba(180,122,255,.1); color: var(--purple);
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            cursor: pointer; transition: all .18s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-double:hover { background: rgba(180,122,255,.22); border-color: var(--purple); box-shadow: 0 0 14px rgba(180,122,255,.25); }
        .btn-double.flash { background: var(--purple) !important; color: #fff !important; }
        .btn-double .tb-icon { font-size: 13px; line-height: 1.1; }
        .btn-double .tb-main { font-size: 11px; letter-spacing: .3px; }
        .btn-double .tb-sub  { font-size: 8px; font-weight: 400; opacity: .8; }

        #trade-feedback-bar {
            margin-left: auto; font-family:'JetBrains Mono',monospace; font-size:10px;
            padding: 3px 10px; border-radius: 5px; white-space: nowrap; display:none;
            max-width: 320px; overflow:hidden; text-overflow:ellipsis;
        }
        #trade-feedback-bar.ok   { display:block; background:rgba(0,200,150,.12); color:var(--green); border:1px solid rgba(0,200,150,.3); }
        #trade-feedback-bar.err  { display:block; background:rgba(255,77,106,.12); color:var(--red);   border:1px solid rgba(255,77,106,.3); }
        #trade-feedback-bar.pend { display:block; background:rgba(61,126,255,.12); color:var(--accent); border:1px solid rgba(61,126,255,.3); }

        .hint { position:absolute; bottom:12px; left:18px; font-size:9px; color:var(--muted);
                display:flex; gap:10px; pointer-events:none; }
        .hint span { display:flex; align-items:center; gap:3px; }
        .hkey { background:var(--surface2); border:1px solid var(--border2); border-radius:3px;
                padding:1px 4px; font-size:8px; font-family:'JetBrains Mono',monospace; }

        #tie-bar {
            background: #0d1120;
            border-bottom: 1px solid var(--border);
            padding: 5px 16px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0; overflow-x: auto;
        }
        #tie-bar::-webkit-scrollbar { height: 0; }
        .tie-title {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
            color: var(--orange); white-space: nowrap;
        }
        .tie-sep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
        .tie-tick-box {
            display:flex; flex-direction:column; align-items:center; gap:3px;
            padding: 4px 10px; border-radius:6px;
            border: 1px solid var(--border2); background: var(--surface2);
            min-width: 62px; transition: all .35s;
        }
        .tie-tick-box .ttb-lbl { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
        .tie-tick-box .ttb-pct { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--muted); }
        .tie-tick-box .ttb-bar-track { width:100%; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
        .tie-tick-box .ttb-bar-fill  { height:100%; border-radius:2px; transition:width .4s, background .4s; }
        .tie-tick-box.caution { border-color:rgba(255,170,64,.5); background:rgba(255,170,64,.07); }
        .tie-tick-box.caution .ttb-pct { color:var(--orange); }
        .tie-tick-box.hot { border-color:rgba(255,77,106,.5); background:rgba(255,77,106,.08); }
        .tie-tick-box.hot .ttb-pct { color:var(--red); }
        .tie-signal {
            padding:3px 12px; border-radius:5px;
            font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
            white-space:nowrap; border:1px solid transparent; flex-shrink:0;
        }
        .tie-signal.safe    { background:rgba(0,200,150,.1);  color:var(--green);  border-color:rgba(0,200,150,.3); }
        .tie-signal.caution { background:rgba(255,170,64,.1); color:var(--orange); border-color:rgba(255,170,64,.3); }
        .tie-signal.danger  { background:rgba(255,77,106,.1); color:var(--red);    border-color:rgba(255,77,106,.3); }
        .tie-signal.neut    { background:var(--surface2);     color:var(--muted);  border-color:var(--border2); }
        .tie-info-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }

// ═════════ NOUVELLE AUTHENTIFICATION OAUTH2 PKCE ═════════

function generateRandomString(length) {
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    let text = '';
    for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
    }
    return text;
}

async function generateCodeChallenge(codeVerifier) {
    const encoder = new TextEncoder();
    const data = encoder.encode(codeVerifier);
    const digest = await window.crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function connectTrading() {
    const state = generateRandomString(16);
    const codeVerifier = generateRandomString(64);
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    sessionStorage.setItem('oauth_state', state);
    sessionStorage.setItem('oauth_verifier', codeVerifier);

    const scope = 'trade';
    const oauthUrl = `https://auth.deriv.com/oauth2/auth` +
                     `?response_type=code` +
                     `&client_id=${CLIENT_ID}` +
                     `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                     `&scope=${scope}` +
                     `&state=${state}` +
                     `&code_challenge=${codeChallenge}` +
                     `&code_challenge_method=S256`;

    window.location.href = oauthUrl;
}

function disconnectTrading() {
    sessionStorage.clear();
    localStorage.removeItem('access_token');
    localStorage.removeItem('is_logged');
    accessToken = null;
    selectedAccountId = null;
    tradeAuthorized = false;
    if (wsTrading) { wsTrading.onclose = null; wsTrading.close(); wsTrading = null; }
    document.getElementById('account-select').innerHTML = '<option value="">-- Connectez-vous --</option>';
    setTokStatus('Déconnecté','var(--muted)');
    document.getElementById('btn-connect').style.display = 'inline-block';
    document.getElementById('btn-disconnect').style.display = 'none';
    document.getElementById('trading-panel')?.style.display = 'none';
}

// ══════ RÉCUPÉRATION DES COMPTES VIA REST ══════
async function fetchDerivAccounts() {
    if (!accessToken) return;
    try {
        const resp = await fetch('https://api.derivws.com/trading/v1/options/accounts', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Deriv-App-ID': CLIENT_ID
            }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        const accounts = json.data || [];
        const sel = document.getElementById('account-select');
        sel.innerHTML = '<option value="">-- Choisir --</option>';
        if (accounts.length === 0) {
            // tentative de création compte démo
            await createDerivAccount('demo');
            return fetchDerivAccounts();
        }
        accounts.forEach(acc => {
            const opt = document.createElement('option');
            opt.value = acc.account_id;
            const typeLabel = acc.account_type === 'demo' ? 'Démo (DOT)' : 'Réel (ROT)';
            opt.text = `${typeLabel} - ${acc.account_id} (${acc.currency || 'USD'})`;
            sel.appendChild(opt);
        });
        // Sélectionner le premier compte par défaut et lancer la session
        if (accounts.length > 0) {
            sel.value = accounts[0].account_id;
            switchAccountSession(accounts[0].account_id);
        }
    } catch (err) {
        console.error('fetchDerivAccounts', err);
    }
}

async function createDerivAccount(type) {
    try {
        await fetch('https://api.derivws.com/trading/v1/options/accounts', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Deriv-App-ID': CLIENT_ID,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ currency: "USD", group: "row", account_type: type })
        });
    } catch(e) { console.error(e); }
}

// ══════ OBTENTION OTP ET CONNEXION WS ══════
async function switchAccountSession(accountId) {
    if (!accountId || !accessToken) return;
    selectedAccountId = accountId;
    if (wsTrading) {
        wsTrading.onclose = null;
        wsTrading.close();
        wsTrading = null;
    }
    setTokStatus('⏳ Obtention OTP...', 'var(--accent)');
    try {
        const resp = await fetch(`https://api.derivws.com/trading/v1/options/accounts/${accountId}/otp`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Deriv-App-ID': CLIENT_ID
            }
        });
        if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${resp.status}`);
        }
        const otpData = await resp.json();
        const wsUrl = otpData.data?.url;
        if (!wsUrl) throw new Error('URL WebSocket manquante');
        openAuthenticatedWebSocket(wsUrl);
    } catch (err) {
        setTokStatus('❌ Échec OTP', 'var(--red)');
        console.error(err);
    }
}

function openAuthenticatedWebSocket(wsUrl) {
    wsTrading = new WebSocket(wsUrl);
    wsTrading._pingTimer = null;

    wsTrading.onopen = () => {
        tradeAuthorized = true;
        setTokStatus(`✓ ${selectedAccountId} connecté`, 'var(--green)');
        document.getElementById('btn-connect').style.display = 'none';
        document.getElementById('btn-disconnect').style.display = 'inline-block';
        wsTrading._pingTimer = setInterval(() => {
            if (wsTrading && wsTrading.readyState === WebSocket.OPEN) {
                wsTrading.send(JSON.stringify({ ping: 1 }));
            }
        }, 25000);
    };

    wsTrading.onmessage = (evt) => _handleTradingMessage(JSON.parse(evt.data));

    wsTrading.onclose = () => {
        if (wsTrading._pingTimer) clearInterval(wsTrading._pingTimer);
        tradeAuthorized = false;
        setTokStatus('Déconnecté — reconnexion...', 'var(--muted)');
        document.getElementById('btn-connect').style.display = 'inline-block';
        document.getElementById('btn-disconnect').style.display = 'none';
        // tentative de reconnexion automatique si token encore valide
        if (accessToken && selectedAccountId) setTimeout(() => switchAccountSession(selectedAccountId), 5000);
    };

    wsTrading.onerror = () => wsTrading.close();
}

// ══════ HANDLER TRADING (PROPOSAL + BUY) ══════
function _handleTradingMessage(d) {
    if (d.msg_type === 'proposal' && d.proposal) {
        const proposalId = d.proposal.id;
        const askPrice = d.proposal.ask_price;
        // Envoyer immédiatement l'ordre d'achat
        wsTrading.send(JSON.stringify({
            buy: proposalId,
            price: askPrice,
            req_id: 2
        }));
    } else if (d.msg_type === 'buy') {
        if (d.error) {
            showFeedback('❌ ' + d.error.message, 'err');
        } else {
            const b = d.buy;
            statsTotal++;
            openContracts[b.contract_id] = { buy_price: parseFloat(b.buy_price) };
            showFeedback('✓ #' + b.contract_id + ' | $' + parseFloat(b.buy_price).toFixed(2), 'ok');
            updateStatsDisplay();
            wsTrading.send(JSON.stringify({ proposal_open_contract: 1, contract_id: b.contract_id, subscribe: 1 }));
        }
    } else if (d.msg_type === 'proposal_open_contract') {
        if (!d.error && d.proposal_open_contract) {
            const poc = d.proposal_open_contract;
            const cid = poc.contract_id;
            const isClosed = poc.status === 'sold' || poc.status === 'expired' || poc.is_expired === 1;
            if (isClosed && !settledContracts.has(cid)) {
                settledContracts.add(cid);
                const netProfit = parseFloat(parseFloat(poc.profit || 0).toFixed(2));
                if (netProfit > 0) statsWin++;
                else if (netProfit < 0) statsLoss++;
                statsPnl = parseFloat((statsPnl + netProfit).toFixed(2));
                delete openContracts[cid];
                updateStatsDisplay();
                const sign = netProfit >= 0 ? '+' : '';
                const payout = parseFloat(poc.sell_price || 0).toFixed(2);
                showFeedback(
                    (netProfit >= 0 ? '✓ Gain net: ' : '❌ Perte: ') + sign + netProfit.toFixed(2) + '$  (payout: ' + payout + '$)',
                    netProfit >= 0 ? 'ok' : 'err'
                );
            }
        }
    } else if (d.msg_type === 'error') {
        showFeedback('❌ ' + d.error.message, 'err');
    }
}

// ══════ TRADING (ADAPTÉ AVEC PROPOSAL) ══════
function placeTrade(dir) {
    if (!tradeAuthorized || !wsTrading) { showFeedback('⚠ Connectez-vous et sélectionnez un compte', 'err'); return; }
    const stake = parseFloat(document.getElementById('stake-input').value);
    if (!stake || stake < 0.35) { showFeedback('⚠ Mise min. $0.35', 'err'); return; }
    const durVal = parseInt(document.getElementById('dur-value').value);
    if (!durVal || durVal < 1) { showFeedback('⚠ Durée invalide', 'err'); return; }
    if (durType === 's' && durVal < 15) { showFeedback('⚠ Durée min 15 secondes', 'err'); return; }

    const contractType = allowEqual ? (dir === 'up' ? 'CALLE' : 'PUTE') : (dir === 'up' ? 'CALL' : 'PUT');
    const underlying = tradeSymbol(); // ex: STPRNG5

    // Envoyer la demande de cotation (proposal)
    wsTrading.send(JSON.stringify({
        proposal: 1,
        amount: stake,
        basis: 'stake',
        contract_type: contractType,
        currency: 'USD',
        duration: durVal,
        duration_unit: durType,
        underlying_symbol: underlying,
        req_id: 1
    }));

    const btnId = dir === 'up' ? 'btn-up' : 'btn-dn';
    const btn = document.getElementById(btnId);
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 500);
    showFeedback('⏳ Proposition ' + contractType + '...', 'pend');
}

// ══════ INITIALISATION AU CHARGEMENT ══════
window.onload = async () => {
    initChart();
    connectChartWS();
    updateEV();
    updateDoubleLabel();

    // Gestion du retour OAuth
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');

    if (code && state) {
        const savedState = sessionStorage.getItem('oauth_state');
        if (state !== savedState) {
            alert('Erreur de sécurité (state).');
            return;
        }
        // Échange code contre token
        try {
            const resp = await fetch('https://auth.deriv.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'authorization_code',
                    client_id: CLIENT_ID,
                    code: code,
                    code_verifier: sessionStorage.getItem('oauth_verifier'),
                    redirect_uri: REDIRECT_URI
                })
            });
            if (!resp.ok) throw new Error('Échec token');
            const tok = await resp.json();
            if (tok.access_token) {
                accessToken = tok.access_token;
                localStorage.setItem('access_token', accessToken);
                localStorage.setItem('is_logged', 'true');
                window.history.replaceState({}, document.title, REDIRECT_URI);
                // Nettoyer l'URL
                setTimeout(() => {
                    document.getElementById('btn-connect').style.display = 'none';
                    document.getElementById('btn-disconnect').style.display = 'inline-block';
                    fetchDerivAccounts();
                }, 100);
            }
        } catch (err) {
            console.error(err);
            alert('Erreur lors de l’authentification.');
        }
    } else {
        // Vérifier si déjà connecté (token en localStorage)
        const savedToken = localStorage.getItem('access_token');
        const savedLogged = localStorage.getItem('is_logged');
        if (savedLogged === 'true' && savedToken) {
            accessToken = savedToken;
            document.getElementById('btn-connect').style.display = 'none';
            document.getElementById('btn-disconnect').style.display = 'inline-block';
            fetchDerivAccounts();
        }
    }
};
</script>
</body>
</html>
